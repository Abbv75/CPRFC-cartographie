name: Build & Deploy via FTP

on:
  push:
    branches:
      - push-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build app
      - name: Build project
        run: |
          npm run build
        env:
          CI: false
          NODE_ENV: production
          REACT_APP_SHAPE_FILE_URL: ${{ secrets.REACT_APP_SHAPE_FILE_URL }}
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_ROOT_URL: ${{ secrets.REACT_APP_ROOT_URL }}

      # 5️⃣ Upload build folder via FTP
      - name: Deploy build via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: build/
          server-dir: /web/
          dangerous-clean-slate: false
